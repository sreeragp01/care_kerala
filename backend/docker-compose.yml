version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: carelink_postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=carelink_db
      - POSTGRES_USER=carelink_user
      - POSTGRES_PASSWORD=carelink_secure_pass
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    container_name: carelink_redis
    ports:
      - "6379:6379"

  backend:
    build: .
    container_name: carelink_backend
    command: gunicorn --bind 0.0.0.0:8000 --workers 3 config.wsgi:application
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    ports:
      - "8000:8000"
    environment:
      - DEBUG=0
      - SECRET_KEY=prod-secret-key-carelink-kerala-2026
      - ALLOWED_HOSTS=*
      - DATABASE_URL=postgres://carelink_user:carelink_secure_pass@db:5432/carelink_db
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis

  celery:
    build: .
    container_name: carelink_celery
    command: celery -A config worker --loglevel=info
    volumes:
      - .:/app
    environment:
      - DATABASE_URL=postgres://carelink_user:carelink_secure_pass@db:5432/carelink_db
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - backend
      - redis

volumes:
  postgres_data:
  static_volume:
  media_volume:
